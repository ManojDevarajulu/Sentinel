name: "Sentinel Blast Radius"
description: "Analyze PR blast radius before merge"
inputs:
  api_url:
    description: "Sentinel API URL"
    required: true
  repo_id:
    description: "Sentinel repo identifier"
    required: true
  github_token:
    description: "GitHub token used to read PR files and post comments"
    required: true
runs:
  using: "node20"
  main: "dist/index.js"
