<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel Code Architecture — Sentinel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0b;
      --bg2: #111114;
      --bg3: #18181d;
      --panel: #111114;
      --panel-border: #222228;
      --border2: #2e2e38;
      --text: #f0f0f2;
      --text-muted: #8888a0;
      --text-sub: #55556a;
      --accent: #e8ff47;
      --accent2: #ff6b35;
      --accent3: #47b8ff;
      --critical: #ff4757;
      --warning: #ffa502;
      --safe: #2ed573;
      --font-head: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(10, 10, 11, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--panel-border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .title-group h1 {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }
    .title-group p {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .search-input {
      background: var(--bg2);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--font-mono);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      width: 220px;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.08);
    }
    .btn {
      background: var(--bg2);
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--font-mono);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn:hover {
      background: var(--bg3);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-accent {
      background: var(--text);
      color: #0a0a0b;
      border: 1px solid var(--text);
      font-weight: 600;
    }
    .btn-accent:hover {
      background: #ffffff;
      border-color: #ffffff;
      color: #000;
    }
    .main-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, rgba(232, 255, 71, 0.02) 0%, transparent 60%);
    }
    #canvas-svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #canvas-svg:active {
      cursor: grabbing;
    }
    /* Detail Drawer */
    .drawer {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 340px;
      background: rgba(17, 17, 20, 0.95);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 16px;
      z-index: 15;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      transition: all 0.2s ease;
    }
    .drawer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }
    .badge-critical { background: rgba(255, 71, 87, 0.12); color: var(--critical); border: 1px solid rgba(255, 71, 87, 0.3); }
    .badge-warning { background: rgba(255, 165, 2, 0.12); color: var(--warning); border: 1px solid rgba(255, 165, 2, 0.3); }
    .badge-safe { background: rgba(46, 213, 115, 0.12); color: var(--safe); border: 1px solid rgba(46, 213, 115, 0.3); }
    .badge-lime { background: rgba(232, 255, 71, 0.1); color: var(--accent); border: 1px solid rgba(232, 255, 71, 0.3); }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
      margin-bottom: 12px;
    }
    .meta-card {
      background: var(--bg2);
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
    }
    .meta-card .num {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 800;
      color: var(--accent);
    }
    .meta-card .lbl {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    /* Floating Action Bar */
    .float-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 17, 20, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border2);
      border-radius: 30px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 15;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .mode-tab {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }
    .mode-tab.active {
      background: rgba(232, 255, 71, 0.12);
      color: var(--accent);
      border: 1px solid rgba(232, 255, 71, 0.3);
    }
    .node-element {
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .node-element:hover circle {
      stroke: var(--accent);
      stroke-width: 2.5px;
    }
    .edge-element {
      stroke: #222228;
      stroke-width: 1.2px;
      transition: stroke 0.2s, stroke-width 0.2s;
    }
    .edge-highlight {
      stroke: #ff4757 !important;
      stroke-width: 2.2px !important;
    }
    .edge-downstream {
      stroke: #e8ff47 !important;
      stroke-width: 2.2px !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo-badge">SENTINEL</div>
      <div class="title-group">
        <h1 id="header-repo-title">Sentinel Architecture</h1>
        <p id="header-stats">Dependency Graph & Blast-Radius Engine</p>
      </div>
    </div>
    <div class="controls">
      <input type="text" id="search-input" class="search-input" placeholder="Search files... (/)" />
      <button class="btn" id="btn-zoom-in">+</button>
      <button class="btn" id="btn-zoom-out">-</button>
      <button class="btn" id="btn-reset">Reset (0)</button>
      <button class="btn btn-accent" id="btn-copy-mermaid">Copy Mermaid</button>
    </div>
  </header>

  <div class="main-container">
    <svg id="canvas-svg">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#3a3a46" />
        </marker>
        <marker id="arrow-hit" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff4757" />
        </marker>
        <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="glow-lime" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>
      <g id="viewport-group">
        <g id="edges-group"></g>
        <g id="nodes-group"></g>
      </g>
    </svg>

    <!-- Detail Drawer -->
    <div class="drawer" id="detail-drawer">
      <div class="drawer-header">
        <div>
          <span class="badge badge-safe" id="node-kind-badge">NODE</span>
          <h2 id="node-label" style="font-family:var(--font-head); font-size:16px; font-weight:700; margin-top:4px;">Select a Node</h2>
        </div>
      </div>
      <p id="node-path" style="font-family:var(--font-mono); font-size:11px; color:var(--text-muted); word-break:break-all;"></p>

      <div class="meta-grid">
        <div class="meta-card"><div class="num" id="meta-in-degree">0</div><div class="lbl">Upstream Importers</div></div>
        <div class="meta-card"><div class="num" id="meta-out-degree">0</div><div class="lbl">Downstream Dependencies</div></div>
        <div class="meta-card"><div class="num" id="meta-loc">0</div><div class="lbl">Lines of Code</div></div>
        <div class="meta-card"><div class="num" id="meta-importance">0</div><div class="lbl">Importance Score</div></div>
      </div>

      <div id="blast-section" style="margin-top:12px; border-top:1px solid #1f293d; padding-top:10px;">
        <h3 style="font-size:12px; text-transform:uppercase; color:var(--text-muted); margin-bottom:6px;">Blast Radius Impact</h3>
        <p id="blast-status" style="font-size:13px; line-height:1.4; color:#e2e8f0;"></p>
      </div>
    </div>

    <!-- Floating Navigation Bar -->
    <div class="float-bar">
      <div class="mode-tab active" data-mode="all">All Dependencies</div>
      <div class="mode-tab" data-mode="upstream">Upstream Blast Radius</div>
      <div class="mode-tab" data-mode="downstream">Downstream Chain</div>
    </div>
  </div>

  <script>
    const DATA = {"repoName": "Sentinel", "nodes": [{"id": "eval_benchmark.py", "label": "eval_benchmark.py", "path": "eval_benchmark.py", "kind": "OTHER", "color": "#8888a0", "loc": 70, "importance": 20, "inDegree": 0, "outDegree": 2, "exports": ["run_evaluation"], "x": 996.1610951566456, "y": 721.028387229617}, {"id": "sentinel.py", "label": "sentinel.py", "path": "sentinel.py", "kind": "OTHER", "color": "#8888a0", "loc": 201, "importance": 20, "inDegree": 0, "outDegree": 3, "exports": ["run_scan", "run_blast_radius", "run_git_diff", "run_serve", "main"], "x": 729.2633163401538, "y": 912.2672333712885}, {"id": "setup.py", "label": "setup.py", "path": "setup.py", "kind": "OTHER", "color": "#8888a0", "loc": 24, "importance": 20, "inDegree": 0, "outDegree": 0, "exports": [], "x": 401.88179520636527, "y": 887.2061034905018}, {"id": "src/__init__.py", "label": "__init__.py", "path": "src/__init__.py", "kind": "OTHER", "color": "#8888a0", "loc": 2, "importance": 20, "inDegree": 0, "outDegree": 0, "exports": [], "x": 167.201983934103, "y": 657.571378781911}, {"id": "src/ast_extractor.py", "label": "ast_extractor.py", "path": "src/ast_extractor.py", "kind": "OTHER", "color": "#8888a0", "loc": 285, "importance": 35, "inDegree": 3, "outDegree": 1, "exports": ["strip_js_comments", "ASTExtractor"], "x": 135.03317439323763, "y": 330.81169904235304}, {"id": "src/graph_engine.py", "label": "graph_engine.py", "path": "src/graph_engine.py", "kind": "OTHER", "color": "#8888a0", "loc": 179, "importance": 35, "inDegree": 3, "outDegree": 1, "exports": ["GraphEngine"], "x": 320.4275100844345, "y": 59.82154995129338}, {"id": "src/types.py", "label": "types.py", "path": "src/types.py", "kind": "OTHER", "color": "#8888a0", "loc": 61, "importance": 40, "inDegree": 4, "outDegree": 0, "exports": ["NodeKind", "EdgeKind", "CodeNode", "CodeEdge", "BlastRadiusReport"], "x": 636.6369209092511, "y": -28.599766011527947}, {"id": "src/viewer_generator.py", "label": "viewer_generator.py", "path": "src/viewer_generator.py", "kind": "OTHER", "color": "#8888a0", "loc": 676, "importance": 30, "inDegree": 2, "outDegree": 1, "exports": ["ViewerGenerator"], "x": 935.7035092666083, "y": 106.92106758635822}, {"id": "tests/test_sentinel_core.py", "label": "test_sentinel_core.py", "path": "tests/test_sentinel_core.py", "kind": "TEST", "color": "#55556a", "loc": 123, "importance": 15, "inDegree": 0, "outDegree": 4, "exports": ["TestSentinelCore"], "x": 1077.6906947092002, "y": 402.9723465582045}], "edges": [{"source": "eval_benchmark.py", "target": "src/ast_extractor.py", "kind": "STATIC_IMPORT", "symbols": ["ASTExtractor"]}, {"source": "eval_benchmark.py", "target": "src/graph_engine.py", "kind": "STATIC_IMPORT", "symbols": ["GraphEngine"]}, {"source": "sentinel.py", "target": "src/ast_extractor.py", "kind": "STATIC_IMPORT", "symbols": ["ASTExtractor"]}, {"source": "sentinel.py", "target": "src/graph_engine.py", "kind": "STATIC_IMPORT", "symbols": ["GraphEngine"]}, {"source": "sentinel.py", "target": "src/viewer_generator.py", "kind": "STATIC_IMPORT", "symbols": ["ViewerGenerator"]}, {"source": "src/ast_extractor.py", "target": "src/types.py", "kind": "STATIC_IMPORT", "symbols": ["CodeEdge", "CodeNode", "EdgeKind", "NodeKind"]}, {"source": "src/graph_engine.py", "target": "src/types.py", "kind": "STATIC_IMPORT", "symbols": ["BlastRadiusReport", "CodeEdge", "CodeNode", "NodeKind"]}, {"source": "src/viewer_generator.py", "target": "src/types.py", "kind": "STATIC_IMPORT", "symbols": ["BlastRadiusReport", "CodeEdge", "CodeNode", "NodeKind"]}, {"source": "tests/test_sentinel_core.py", "target": "src/ast_extractor.py", "kind": "STATIC_IMPORT", "symbols": ["ASTExtractor"]}, {"source": "tests/test_sentinel_core.py", "target": "src/graph_engine.py", "kind": "STATIC_IMPORT", "symbols": ["GraphEngine"]}, {"source": "tests/test_sentinel_core.py", "target": "src/types.py", "kind": "STATIC_IMPORT", "symbols": ["EdgeKind", "NodeKind"]}, {"source": "tests/test_sentinel_core.py", "target": "src/viewer_generator.py", "kind": "STATIC_IMPORT", "symbols": ["ViewerGenerator"]}], "report": {"changed_files": [], "affected_nodes": [], "blast_radius_count": 0, "risk_level": "SAFE", "risk_score": 0, "critical_paths": [], "hop_distances": {}, "summary": "Full repository dependency architecture view."}};

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let selectedNodeId = null;
    let currentMode = "all";

    const svg = document.getElementById("canvas-svg");
    const viewport = document.getElementById("viewport-group");
    const nodesGroup = document.getElementById("nodes-group");
    const edgesGroup = document.getElementById("edges-group");

    // Initialize Canvas
    function init() {
      renderGraph();
      setupEvents();
      centerGraph();
      if (DATA.report.changed_files && DATA.report.changed_files.length > 0) {
        selectNode(DATA.report.changed_files[0]);
      }
    }

    function renderGraph() {
      nodesGroup.innerHTML = "";
      edgesGroup.innerHTML = "";

      // Render Edges
      DATA.edges.forEach((edge, i) => {
        const src = DATA.nodes.find(n => n.id === edge.source);
        const tgt = DATA.nodes.find(n => n.id === edge.target);
        if (!src || !tgt) return;

        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", src.x);
        line.setAttribute("y1", src.y);
        line.setAttribute("x2", tgt.x);
        line.setAttribute("y2", tgt.y);
        line.setAttribute("class", "edge-element");
        line.setAttribute("marker-end", "url(#arrow)");
        line.id = `edge-${edge.source}-${edge.target}`;
        edgesGroup.appendChild(line);
      });

      // Render Nodes
      DATA.nodes.forEach(node => {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("class", "node-element");
        g.setAttribute("transform", `translate(${node.x}, ${node.y})`);
        g.id = `node-${node.id}`;

        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        const radius = Math.min(24, Math.max(10, 8 + node.inDegree * 2.5));
        circle.setAttribute("r", radius);
        circle.setAttribute("fill", node.color);
        circle.setAttribute("stroke", "#1e293b");
        circle.setAttribute("stroke-width", "2");

        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("y", radius + 14);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("fill", "#e2e8f0");
        text.setAttribute("font-size", "11px");
        text.setAttribute("font-weight", "600");
        text.textContent = node.label.length > 18 ? node.label.substring(0, 15) + "..." : node.label;

        g.appendChild(circle);
        g.appendChild(text);

        g.addEventListener("click", (e) => {
          e.stopPropagation();
          selectNode(node.id);
        });

        nodesGroup.appendChild(g);
      });
    }

    function selectNode(id) {
      selectedNodeId = id;
      const node = DATA.nodes.find(n => n.id === id);
      if (!node) return;

      document.getElementById("node-label").textContent = node.label;
      document.getElementById("node-path").textContent = node.path;
      document.getElementById("meta-in-degree").textContent = node.inDegree;
      document.getElementById("meta-out-degree").textContent = node.outDegree;
      document.getElementById("meta-loc").textContent = node.loc;
      document.getElementById("meta-importance").textContent = node.importance;

      const badge = document.getElementById("node-kind-badge");
      badge.textContent = node.kind;
      badge.style.background = node.color + "33";
      badge.style.color = node.color;
      badge.style.border = `1px solid ${node.color}88`;

      // Calculate blast radius highlighting
      const upstream = getUpstreamReach(id);
      const downstream = getDownstreamReach(id);

      document.getElementById("blast-status").innerHTML = 
        `Modifying <strong>${node.label}</strong> directly impacts <strong>${upstream.size}</strong> upstream file(s).`;

      // Highlight Canvas Elements
      highlightCanvas(id, upstream, downstream);
    }

    function getUpstreamReach(id) {
      const visited = new Set();
      const q = [id];
      while(q.length > 0) {
        const curr = q.shift();
        DATA.edges.forEach(e => {
          if (e.target === curr && !visited.has(e.source)) {
            visited.add(e.source);
            q.push(e.source);
          }
        });
      }
      return visited;
    }

    function getDownstreamReach(id) {
      const visited = new Set();
      const q = [id];
      while(q.length > 0) {
        const curr = q.shift();
        DATA.edges.forEach(e => {
          if (e.source === curr && !visited.has(e.target)) {
            visited.add(e.target);
            q.push(e.target);
          }
        });
      }
      return visited;
    }

    function highlightCanvas(focusedId, upstreamSet, downstreamSet) {
      DATA.nodes.forEach(n => {
        const el = document.getElementById(`node-${n.id}`);
        if (!el) return;
        const circle = el.querySelector("circle");

        if (n.id === focusedId) {
          circle.setAttribute("stroke", "#ffffff");
          circle.setAttribute("stroke-width", "3.5");
          circle.setAttribute("filter", "url(#glow-lime)");
          el.style.opacity = "1";
        } else if (upstreamSet.has(n.id) && (currentMode === "all" || currentMode === "upstream")) {
          circle.setAttribute("stroke", "#ff4757");
          circle.setAttribute("stroke-width", "2.5");
          circle.setAttribute("filter", "url(#glow-red)");
          el.style.opacity = "1";
        } else if (downstreamSet.has(n.id) && (currentMode === "all" || currentMode === "downstream")) {
          circle.setAttribute("stroke", "#e8ff47");
          circle.setAttribute("stroke-width", "2.5");
          circle.setAttribute("filter", "url(#glow-lime)");
          el.style.opacity = "1";
        } else {
          circle.setAttribute("stroke", "#222228");
          circle.setAttribute("stroke-width", "1.5");
          circle.removeAttribute("filter");
          el.style.opacity = currentMode === "all" ? "0.6" : "0.15";
        }
      });

      DATA.edges.forEach(e => {
        const edgeEl = document.getElementById(`edge-${e.source}-${e.target}`);
        if (!edgeEl) return;

        if (upstreamSet.has(e.source) && (e.target === focusedId || upstreamSet.has(e.target))) {
          edgeEl.setAttribute("class", "edge-element edge-highlight");
        } else if (downstreamSet.has(e.target) && (e.source === focusedId || downstreamSet.has(e.source))) {
          edgeEl.setAttribute("class", "edge-element edge-downstream");
        } else {
          edgeEl.setAttribute("class", "edge-element");
          edgeEl.style.opacity = currentMode === "all" ? "0.4" : "0.08";
        }
      });
    }

    function setupEvents() {
      svg.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      svg.addEventListener("wheel", (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        scale = Math.min(3, Math.max(0.2, scale * delta));
        updateTransform();
      });

      document.getElementById("btn-zoom-in").addEventListener("click", () => {
        scale = Math.min(3, scale * 1.2);
        updateTransform();
      });

      document.getElementById("btn-zoom-out").addEventListener("click", () => {
        scale = Math.max(0.2, scale * 0.8);
        updateTransform();
      });

      document.getElementById("btn-reset").addEventListener("click", centerGraph);

      document.getElementById("search-input").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase().trim();
        if (!q) return;
        const match = DATA.nodes.find(n => n.path.toLowerCase().includes(q) || n.label.toLowerCase().includes(q));
        if (match) selectNode(match.id);
      });

      document.querySelectorAll(".mode-tab").forEach(tab => {
        tab.addEventListener("click", (e) => {
          document.querySelectorAll(".mode-tab").forEach(t => t.classList.remove("active"));
          e.target.classList.add("active");
          currentMode = e.target.dataset.mode;
          if (selectedNodeId) selectNode(selectedNodeId);
        });
      });

      document.getElementById("btn-copy-mermaid").addEventListener("click", () => {
        let mm = "graph TD;\n";
        DATA.edges.forEach(e => {
          mm += `  ${e.source.replace(/[^a-zA-Z0-9]/g, "_")} --> ${e.target.replace(/[^a-zA-Z0-9]/g, "_")};\n`;
        });
        const btn = document.getElementById("btn-copy-mermaid");
        navigator.clipboard.writeText(mm).then(() => {
          if (btn) {
            const orig = btn.textContent;
            btn.textContent = "Copied!";
            setTimeout(() => { btn.textContent = orig; }, 1800);
          }
        });
      });
    }

    function centerGraph() {
      scale = 0.92;
      translateX = (window.innerWidth - 340) / 2 - 600 * scale;
      translateY = window.innerHeight / 2 - 450 * scale;
      updateTransform();
    }

    function updateTransform() {
      viewport.setAttribute("transform", `translate(${translateX}, ${translateY}) scale(${scale})`);
    }

    init();
  </script>
</body>
</html>
