version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    ports:
      - "8001:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Add SUPABASE_URL and SUPABASE_ANON_KEY in a .env file
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://mock.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-mock-key}
    env_file:
      - .env
    depends_on:
      - api
