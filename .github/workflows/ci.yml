name: Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify CLI Installation
        run: |
          pip install .
          sentinel --help

      - name: Run Test Suite
        run: |
          make test

      - name: Run Empirical Performance Benchmark
        run: |
          make eval
